version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    volumes:
      - ../src:/app/src
    # Giả sử bạn có file streamlit_app.py trong thư mục app
    command: streamlit run src/app/ui_streamlit.py --server.port 8501 --server.address 0.0.0.0

  # Có thể thêm postgres nếu không dùng sqlite
  # db:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: speaking_coach
  #     POSTGRES_PASSWORD: password