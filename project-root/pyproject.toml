[project]
name = "ai-speaking-coach"
version = "0.1.0"
description = "AI Speaking Coach for IELTS using FastAPI, LangGraph and Azure Speech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "langgraph>=0.0.10",
    "langchain-openai>=0.1.0",
    "azure-cognitiveservices-speech>=1.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "boto3>=1.28.0",
    "streamlit>=1.25.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]