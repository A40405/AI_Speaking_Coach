name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest · Python 3.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv --quiet

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install production dependencies
        run: .venv/bin/python -m uv pip install -r requirements.txt --quiet

      - name: Install test dependencies
        run: .venv/bin/python -m uv pip install -r requirements-test.txt --quiet

      - name: Run test suite
        run: .venv/bin/python -m pytest tests/ --tb=short
        env:
          # pytest sets these defaults in conftest.py
          # Override JWT secret for CI to satisfy minimum length
          JWT_SECRET_KEY: "ci-test-secret-key-for-github-ci!"

      - name: Upload coverage report (optional)
        if: always()
        run: |
          .venv/bin/python -m pip install pytest-cov --quiet
          .venv/bin/python -m pytest tests/ --cov=app --cov-report=xml --quiet
        continue-on-error: true
